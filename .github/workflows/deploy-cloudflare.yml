name: Deploy Cloudflare

on:
  # Site deploys moved to Cloudflare Workers Builds (git push → CF, which
  # runs `npm run build && npm run audit:site` then `wrangler deploy`). On
  # push this workflow only waits for that build, then smoke-tests and pings
  # IndexNow. workflow_dispatch is the manual wrangler deploy fallback.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  # Queue instead of killing a wrangler deploy halfway through.
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

env:
  CI: true
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Wait for Workers Build to go live
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll the "Workers Builds" check run on this commit (10 min cap).
          # No check within 3 min means CF skipped the build (path_excludes,
          # e.g. a workflow-only push): smoke-test what is live and move on.
          start=$SECONDS
          while [ $((SECONDS - start)) -lt 600 ]; do
            states="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds")) | (.status + ":" + (.conclusion // ""))] | join(" ")' || true)"
            echo "Workers Builds: ${states:-not reported yet} ($((SECONDS - start))s)"
            if [ -n "$states" ]; then
              case "$states" in
                *queued*|*in_progress*|*pending*|*waiting*|*requested*) ;;
                *completed:success*) echo "Build succeeded; letting it propagate"; sleep 20; exit 0 ;;
                *) echo "Workers Build did not succeed: $states"; exit 1 ;;
              esac
            elif [ $((SECONDS - start)) -ge 180 ]; then
              echo "No Workers Builds check on this commit; checking the live site as-is"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for the Workers Build"
          exit 1
      - if: github.event_name == 'workflow_dispatch'
        run: npm ci --prefer-offline --no-audit --no-fund --legacy-peer-deps
      - if: github.event_name == 'workflow_dispatch'
        run: npm run build
        env:
          # Workers Builds sets the same build variable on its trigger.
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}
          # Repo variable; leave unset to keep the list signup off.
          PUBLIC_LIST_SIGNUP: ${{ vars.PUBLIC_LIST_SIGNUP }}
      - if: github.event_name == 'workflow_dispatch'
        run: npm run audit:site
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          attempt=1
          max=3
          while true; do
            if npx wrangler deploy --keep-vars; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "Deploy failed after ${max} attempts"
              exit 1
            fi
            echo "Deploy attempt ${attempt}/${max} failed; retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done
      - name: Smoke test Worker
        run: |
          set -euo pipefail
          base="https://scottdillinghamminiatures.com"
          cb="cb=$(date +%s)"
          url="$base/?$cb"
          for i in 1 2 3 4 5; do
            headers=$(curl -sS -D - -o /tmp/mini-smoke.html -w "%{http_code}" "$url" || true)
            code=$(printf '%s' "$headers" | tail -n1)
            if [ "$code" = "200" ] && printf '%s' "$headers" | grep -qi 'cf-ray'; then
              echo "Smoke OK: HTTP $code with cf-ray"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "Smoke test failed: expected HTTP 200 with cf-ray from $url"
              exit 1
            fi
            echo "Smoke attempt $i failed (HTTP ${code:-none}); waiting 15s..."
            sleep 15
          done
          for path in /sitemap-index.xml /robots.txt /llms.txt /ai.txt /.well-known/ai.txt /sdm-indexnow-20260823-a7f4c91e.txt; do
            ok=0
            for i in 1 2 3 4 5; do
              code=$(curl -sS -o /tmp/mini-aeo -w "%{http_code}" "$base$path?$cb" || true)
              if [ "$code" = "200" ]; then
                echo "AEO $path → HTTP $code"
                ok=1
                break
              fi
              echo "AEO $path attempt $i HTTP ${code:-none}; waiting 10s..."
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "Expected 200 for $path"
              exit 1
            fi
          done

      - name: Fetch live sitemap for IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          # No local build on push; the ping script reads dist/client sitemaps.
          mkdir -p dist/client
          curl -fsS "https://scottdillinghamminiatures.com/sitemap-0.xml?cb=$(date +%s)" -o dist/client/sitemap-0.xml

      - name: Ping IndexNow
        continue-on-error: true
        run: node scripts/ping-indexnow.mjs
